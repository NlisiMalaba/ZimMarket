name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ZimMarket.sln

      - name: Build
        run: dotnet build ZimMarket.sln -c Release --no-restore

      - name: Test
        run: dotnet test ZimMarket.sln -c Release --no-build --verbosity normal

      - name: Docker build (API image)
        run: docker build -f src/ZimMarket.API/Dockerfile -t zimmarket-api:ci .
